[project]
name = "weathergpt"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
markers = [
    "live: tests that hit the real free weather/translate APIs (network needed)",
]
addopts = "-m 'not live'"
testpaths = ["tests"]
